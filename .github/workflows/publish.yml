name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Staged publishing needs a newer npm than Node 24 may bundle
      - run: npm install -g npm@11.16.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # Stages the release; it goes live once a maintainer approves it on npmjs.com with 2FA.
      # prepack builds dist/ first, so this stages a fresh build.
      - run: npm stage publish --provenance --access public
